# Refer for explanation to following link: https://lefthook.dev/configuration/
pre-commit:
  commands:
    format:
      run: bun run format --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      run: bun run lint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
